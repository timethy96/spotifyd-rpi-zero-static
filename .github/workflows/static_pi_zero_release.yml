name: Static Pi Zero Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release (Static ARMv6)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t spotifyd-rpi-zero . --progress=plain

      - name: Extract Static Binary
        run: |
          docker create --name extract spotifyd-rpi-zero /spotifyd
          docker cp extract:/spotifyd ./spotifyd-linux-armv6-musl-static
          docker rm extract

      - name: Verify Binary Architecture
        run: |
          sudo apt-get update && sudo apt-get install -y file
          file ./spotifyd-linux-armv6-musl-static | grep "ARM"
          file ./spotifyd-linux-armv6-musl-static | grep "statically linked"

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly Build (Pi Zero Static)
          tag_name: nightly
          files: spotifyd-linux-armv6-musl-static
          prerelease: true
          body: |
            Automatic nightly build for Raspberry Pi Zero W (ARMv6).

            **Triggered by:** ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
